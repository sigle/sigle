name: Node CI
permissions:
  contents: read
  pull-requests: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-monorepo

      - name: Check dependencies consistency
        run: pnpm syncpack lint

      - name: Build
        run: |
          cp apps/sigle/.env.development apps/sigle/.env.production.local
          pnpm build

      - name: Check formatting, linting and type checks.
        run: pnpm vp check --deny-warnings

      - name: Test
        run: pnpm test

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-monorepo

      - name: Install the Playwright browser
        run: pnpm --filter @sigle/sigle exec playwright install --with-deps chromium

      - name: Run the end-to-end tests
        run: pnpm e2e

      - name: Upload the Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            apps/sigle/playwright-report/
            apps/sigle/test-results/
          retention-days: 7
