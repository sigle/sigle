name: "Setup the monorepo"
description: "Restore the turbo cache, install Node.js, pnpm and the dependencies. Runs after actions/checkout."
runs:
  using: "composite"
  steps:
    # Saved by the Build and Test job on pushes to main only: one entry per
    # main commit keeps the repository under its 10 GB cache quota, and pull
    # requests restore the latest one from main.
    - name: Restore the turbo cache
      uses: actions/cache/restore@v6
      with:
        path: ${{ github.workspace }}/.turbo
        key: ${{ runner.os }}-turbo-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-turbo-

    - name: Use Node.js and pnpm
      uses: pnpm/setup@v2
      with:
        cache: true
        install: false

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
