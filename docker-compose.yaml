services:
  postgres:
    container_name: sigle-postgres
    image: postgres:18-alpine
    ports:
      - 5432:5432
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - postgres_data:/var/lib/postgresql
    environment:
      - POSTGRES_PASSWORD=sigle_password
      - POSTGRES_USER=sigle_user
      - POSTGRES_DB=sigle_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d sigle_db -U sigle_user"]
      interval: 1s
      timeout: 5s
      retries: 10
    networks:
      - sigle-network

  server:
    container_name: sigle-server
    build:
      context: ./
      dockerfile: ./apps/server/Dockerfile.dev
    restart: always
    ports:
      - "3001:3001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgres://sigle_user:sigle_password@postgres:5432/sigle_db?sslmode=disable
    develop:
      watch:
        - path: ./apps/server/package.json
          action: rebuild
        - path: ./apps/server/prisma
          action: rebuild
        - path: ./apps/server/.env.development
          target: /app/apps/server/.env.development
          action: sync+restart
        - path: ./apps/server/.env.development.local
          target: /app/apps/server/.env.development.local
          action: sync+restart
        - path: ./apps/server/
          target: /app/apps/server
          action: sync
        - path: ./packages/
          target: /app/packages
          action: sync
        - path: ./apps/contracts/
          target: /app/apps/contracts
          action: sync
        - path: ./apps/contracts-next/
          target: /app/apps/contracts-next
          action: sync
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sigle-network

  sigle:
    container_name: sigle-app
    profiles:
      - full
    build:
      context: ./
      dockerfile: ./apps/sigle/Dockerfile.dev
    restart: always
    ports:
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - NEXT_PUBLIC_API_URL=http://localhost:3001
    develop:
      watch:
        - path: ./apps/sigle/package.json
          action: rebuild
        - path: ./apps/sigle/
          target: /app/apps/sigle
          action: sync
        - path: ./packages/
          target: /app/packages
          action: sync
        - path: ./apps/contracts/
          target: /app/apps/contracts
          action: sync
        - path: ./apps/contracts-next/
          target: /app/apps/contracts-next
          action: sync
    depends_on:
      - server
    networks:
      - sigle-network

  custom-domain:
    container_name: sigle-custom-domain
    profiles:
      - full
    build:
      context: ./
      dockerfile: ./apps/custom-domain/Dockerfile.dev
    restart: always
    ports:
      - "3002:3002"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - NODE_ENV=development
      - PORT=3002
      - NEXT_PUBLIC_API_URL=http://localhost:3001
    develop:
      watch:
        - path: ./apps/custom-domain/package.json
          action: rebuild
        - path: ./apps/custom-domain/
          target: /app/apps/custom-domain
          action: sync
        - path: ./packages/
          target: /app/packages
          action: sync
        - path: ./apps/contracts/
          target: /app/apps/contracts
          action: sync
        - path: ./apps/contracts-next/
          target: /app/apps/contracts-next
          action: sync
    depends_on:
      - server
    networks:
      - sigle-network

  studio:
    container_name: sigle-studio
    profiles:
      - tools
    build:
      context: ./
      dockerfile: ./apps/server/Dockerfile.dev
    user: node
    ports:
      - "5555:5555"
    environment:
      - DATABASE_URL=postgres://sigle_user:sigle_password@postgres:5432/sigle_db?sslmode=disable
    command: pnpm prisma studio --port 5555 --browser none
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sigle-network

  # cloudflared:
  #   image: cloudflare/cloudflared:2025.2.1
  #   container_name: cloudflared
  #   restart: unless-stopped
  #   command: tunnel --url http://server:3001
  #   depends_on:
  #     - server
  #   networks:
  #     - sigle-network

volumes:
  postgres_data:

networks:
  sigle-network:
    driver: bridge
