services:
  sigle:
    container_name: sigle-app
    profiles:
      - full
    build:
      context: ./
      dockerfile: ./apps/sigle/Dockerfile.dev
    restart: always
    ports:
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - NEXT_PUBLIC_API_URL=http://localhost:3001
    develop:
      watch:
        - path: ./apps/sigle/package.json
          action: rebuild
        - path: ./apps/sigle/
          target: /app/apps/sigle
          action: sync
        - path: ./packages/
          target: /app/packages
          action: sync
    networks:
      - sigle-network

networks:
  sigle-network:
    driver: bridge
