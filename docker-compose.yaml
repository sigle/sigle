services:
  postgres:
    container_name: sigle-postgres
    image: postgres:18-alpine
    ports:
      - 5432:5432
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - postgres_data:/var/lib/postgresql
    environment:
      - POSTGRES_PASSWORD=sigle_password
      - POSTGRES_USER=sigle_user
      - POSTGRES_DB=sigle_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d sigle_db -U sigle_user"]
      interval: 1s
      timeout: 5s
      retries: 10
    networks:
      - sigle-network

  sigle:
    container_name: sigle-app
    profiles:
      - full
    build:
      context: ./
      dockerfile: ./apps/sigle/Dockerfile.dev
    restart: always
    ports:
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - NEXT_PUBLIC_API_URL=http://localhost:3001
    develop:
      watch:
        - path: ./apps/sigle/package.json
          action: rebuild
        - path: ./apps/sigle/
          target: /app/apps/sigle
          action: sync
        - path: ./packages/
          target: /app/packages
          action: sync
    networks:
      - sigle-network

volumes:
  postgres_data:

networks:
  sigle-network:
    driver: bridge
